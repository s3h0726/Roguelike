<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090f1b"><meta name="description" content="OMEGA — a vast sci-fi incremental economy. 32 currencies, 22 facilities, research, crafting, relics and four prestige layers.">
<title>OMEGA // THE INFINITE FOUNDRY</title>
<link rel="stylesheet" href="./styles.css">
</head><body>
<div id="app" class="app-shell">
 <header class="topbar">
  <div class="brand"><div class="brand-symbol"><span>Ω</span></div><div><div class="eyebrow">THE INFINITE FOUNDRY <span class="build-version">v1.0</span></div><strong>OMEGA<span class="brand-dot">.</span></strong></div></div>
  <div id="topStats" class="top-stats"></div>
  <div class="top-actions"><button id="pulseButton" class="pulse-btn" data-action="pulse" title="Trigger an overdrive pulse">⚡ OVERDRIVE</button><span class="save-signal" id="saveSignal">● LOCAL SAVE</span></div>
 </header>
 <div class="workspace">
  <aside class="navigation"><div class="nav-label">CONTROL CENTER</div><nav id="tabNav" aria-label="Game systems"></nav><div class="nav-footer"><div class="status-light"><span class="live-dot"></span> SIMULATION ONLINE</div><div id="navFooterText">TIER I · INDUSTRIAL AGE</div></div></aside>
  <main class="content-frame"><div id="mainContent" class="scroll-content" tabindex="-1"><div class="loading"><span class="spinner"></span>INITIALIZING THE OMEGA ENGINE...</div></div></main>
  <aside class="inventory-panel"><div class="inventory-heading"><div><div class="eyebrow">LIVE TELEMETRY</div><h3>RESOURCES <span>32</span></h3></div><button class="tiny-btn" data-action="toggleResources" title="Show or hide zero-balance resources" id="resourceToggle">ALL</button></div><div id="resourceFilters" class="resource-filters"></div><div id="resourceList" class="resource-list"></div><div id="currentStatus" class="current-status"></div></aside>
 </div>
 <div id="toastContainer" class="toast-container" aria-live="polite"></div>
 <footer class="footer"><span>Ω / OMEGA FOUNDATION</span><span>LOCAL-FIRST · ZERO EXTERNAL DEPENDENCIES · <span id="versionStatus">SIMULATION ACTIVE</span></span><span id="liveClock">00:00:00</span></footer>
</div>
<script type="module" src="./src/main.js"></script>
</body></html>
